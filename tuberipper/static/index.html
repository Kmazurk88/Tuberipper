// Edits are saved on "change" (when a field loses focus). Tapping Continue
// right after typing fires that save and the start request back to back,
// so startMatching() waits for any in-flight saves first -- otherwise the
// lookup could run with the old artist/title.
const pendingSaves = new Set();
function updateTrack(index, patch) {
  const p = fetch(apiUrl(`/api/jobs/${currentJobId}/tracks/${index}`), {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(patch),
  }).catch(() => {}).finally(() => pendingSaves.delete(p));
  pendingSaves.add(p);
  return p;
}

// The lookup and download/tag/lyrics phases each move every accepted track
// through their own sequence of per-track statuses (see statusLabel). This
// figures out which phase is currently running and how far it's gotten, so
// a long playlist shows "X of Y" and what's happening right now instead of
// a single unchanging "Processing…" that looks the same whether it's stuck
// or just slow.
const PHASE2_STATUSES = ['queued_download', 'downloading', 'tagging', 'fetching_lyrics', 'done', 'skipped_exists', 'failed'];
const PHASE2_ACTION_LABEL = { downloading: 'Downloading', tagging: 'Tagging', fetching_lyrics: 'Fetching lyrics' };

function computeProgress(job) {
  const inPhase2 = job.tracks.some(t => PHASE2_STATUSES.includes(t.status));

  if (!inPhase2) {
    const relevant = job.tracks.filter(t => t.status !== 'skipped_not_accepted');
    // Between per-song steps (picking albums, asking iTunes, cover art and
    // lyrics) the server says what it's doing.
    if (job.phase && !relevant.some(t => ['looking_up', 'finding_audio'].includes(t.status))) {
      return { total: relevant.length, done: relevant.length, label: job.phase + '…' };
    }
    const lookingUp = relevant.some(t => ['queued_lookup', 'looking_up'].includes(t.status));
    if (!lookingUp && relevant.some(t => ['finding_audio', 'audio_found'].includes(t.status))) {
      const total = relevant.length;
      const done = relevant.filter(t => ['audio_found', 'awaiting_confirmation'].includes(t.status)).length;
      const current = relevant.find(t => t.status === 'finding_audio');
      return {
        total, done,
        label: current ? `Finding album audio ${Math.min(done + 1, total)} of ${total}: ${current.title}` : 'Picking albums…',
      };
    }
    const total = relevant.length;
    const done = relevant.filter(t => ['looked_up', 'awaiting_confirmation'].includes(t.status)).length;
    const current = relevant.find(t => t.status === 'looking_up');
    return {
      total, done,
      label: current
        ? `Looking up ${Math.min(done + 1, total)} of ${total}: ${current.artist ? current.artist + ' — ' : ''}${current.title}`
        : (done === total ? 'Picking albums…' : 'Looking up songs…'),
    };
  }

  const relevant = job.tracks.filter(t => PHASE2_STATUSES.includes(t.status) || t.status === 'awaiting_confirmation');
  const total = relevant.length;
  const done = relevant.filter(t => ['done', 'skipped_exists', 'failed'].includes(t.status)).length;
  const busy = relevant.filter(t => PHASE2_ACTION_LABEL[t.status]);
  const current = busy[0];
  const name = t => `${(t.match && t.match.artist) || t.artist} — ${(t.match && t.match.title) || t.title}`;
  return {
    total, done,
    label: current
      ? `${PHASE2_ACTION_LABEL[current.status]}: ${name(current)}${busy.length > 1 ? ` (+${busy.length - 1} more at once)` : ''}`
      : 'Finishing up…',
  };
}

function renderProgress(job) {
  if (job.status !== 'processing') {
    progressBlock.style.display = 'none';
    return;
  }
  const p = computeProgress(job);
  progressBlock.style.display = 'block';
  // After the last download, the playlist step (Navidrome scan + add) can
  // take a minute -- say so instead of a stuck-looking "Finishing up…".
  progressLabel.textContent = (p.done === p.total && job.playlist_status) ? job.playlist_status : p.label;
  progressFill.style.width = p.total ? `${Math.round((p.done / p.total) * 100)}%` : '0%';
  progressCount.textContent = `${p.done} / ${p.total}`;
}

let pollFailures = 0;
let lastJob = null;

async function refreshJob() {
  const jobId = currentJobId;
  try {
    const resp = await fetch(apiUrl(`/api/jobs/${jobId}`));
    if (resp.status === 404) {
      topHint.textContent = 'This download is no longer on the server (tuberipper was restarted).';
      clearInterval(pollTimer);
      return;
    }
    if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
    const job = await resp.json();
    if (jobId !== currentJobId) return; // user started something else meanwhile
    lastJob = job;
    renderTracks(job);
    renderProgress(job);
    doneBlock.style.display = ['done', 'cancelled', 'error'].includes(job.status) ? 'flex' : 'none';
    const failedCount = job.tracks.filter(t => t.status === 'failed').length;
    retryFailedBtn.style.display = job.status === 'done' && failedCount ? '' : 'none';
    retryFailedBtn.textContent = `Retry ${failedCount} failed song${failedCount === 1 ? '' : 's'}`;

    if (job.status === 'processing') {
      confirmCard.style.display = 'none';
    } else if (job.status === 'awaiting_confirmation') {
      topHint.textContent = job.refining ? 'Checking which albums these are from — you can already download.' : 'Check the match, then Download.';
      // Keep listening while MusicBrainz corrects the albums.
      if (!job.refining) clearInterval(pollTimer);
      showConfirmCard(job);
    } else if (job.status === 'done') {
      const n = job.tracks.filter(t => t.status === 'done').length;
      const failed = job.tracks.filter(t => t.status === 'failed').length;
      const existed = job.tracks.filter(t => t.status === 'skipped_exists').length;
      const parts = [];
      if (n) parts.push(`${n} added to your library`);
      if (existed) parts.push(`${existed} already in your library`);
      if (failed) parts.push(`${failed} failed`);
      topHint.textContent = 'Done — ' + (parts.join(', ') || 'nothing to add') + '.';
      if (job.playlist_status && !job.playlist_error) topHint.textContent += ' ' + job.playlist_status;
      if (job.playlist_error) topHint.textContent += ' ' + job.playlist_error;
      clearInterval(pollTimer);
    } else if (job.status === 'cancelled') {
      topHint.textContent = 'Cancelled.';
      clearInterval(pollTimer);
    } else if (job.status === 'error') {
      topHint.textContent = 'Error: ' + job.error;
      clearInterval(pollTimer);
    }
    pollFailures = 0;
  } catch (e) {
    // Phones drop connections constantly (Wi-Fi <-> cellular, Tailscale
    // reconnecting). The download keeps running on the server, so keep
    // retrying quietly instead of giving up on the first blip.
    pollFailures++;
    if (pollFailures >= 3) topHint.textContent = 'Reconnecting… (the download keeps going on the server)';
    if (pollFailures >= 60) {
      topHint.textContent = 'Lost connection to tuberipper. The download may still be running; reopen the app to check.';
      clearInterval(pollTimer);
    }
  }
}

// ---------- Create a job from a picked search result or a pasted link ----------
let creatingJob = false;

async function reviewFromSearch(url) {
  if (creatingJob) return;
  creatingJob = true;
  try { await createJobFrom(url); } finally { creatingJob = false; }

async function createJobFrom(url) {
  clearInterval(pollTimer);
  audioExpanded = false;
  doneBlock.style.display = 'none';
  currentJobId = null;
  trackList.innerHTML = '';
  defaultArtistBlock.style.display = 'none';
  startBlock.style.display = 'none';
  confirmCard.style.display = 'none';
  showView('process');
  trackList.innerHTML = '<div class="spinner"></div>';
  topHint.textContent = '';

  try {
    const resp = await fetch(apiUrl('/api/jobs'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
    const job = await resp.json();

    if (job.status === 'error') {
      trackList.innerHTML = '';
      topHint.textContent = job.error;
      doneBlock.style.display = 'flex';
      return;
    }

    currentJobId = job.id;
    // Confident about every artist/title split -> skip the review screen and
    // go straight to finding the album. Only stop to ask when a title was
    // ambiguous or has no artist.
    const needsReview = job.tracks.some(t => t.confidence === 'low' || !t.artist);
    if (!needsReview) {
      topHint.textContent = 'Finding albums…';
      await startMatching();
      return;
    }
    const unsure = job.tracks.filter(t => t.confidence === 'low' || !t.artist).length;
    topHint.textContent = job.tracks.length === 1
      ? 'Check the artist and song name, then Continue.'
      : `${unsure} of ${job.tracks.length} need a quick check. Fix anything wrong, then Continue.`;
    renderTracks(job);
  } catch (e) {
    trackList.innerHTML = '';
    topHint.textContent = 'Couldn\'t reach tuberipper: ' + e.message;
    doneBlock.style.display = 'flex';
  }
}

// ---------- Preview countdown ----------
// YouTube only releases a stream to tuberipper ~15 s after it asks (a delay
// for non-browser clients); the server reports where each preview is, so the
// player can say "YouTube delay · 12s" instead of spinning silently.
function previewCountdown(vid, onText, short = false) {
  let stopped = false, deadline = null, state = 'idle', timer = null, ticker = null;
  const show = () => {
    if (stopped) return;
    if (state === 'waiting' && deadline) {
      const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      onText(left > 0 ? (short ? `Wait ${left}s` : `YouTube delay · ${left}s`) : 'Loading…');
    } else {
      onText((short ? { idle: 'Starting…', resolving: 'Fetching…', ready: 'Loading…', error: 'Failed' }
        : { idle: 'Starting…', resolving: 'Getting audio from YouTube…', ready: 'Loading…', error: 'Couldn\'t load' })[state] || 'Loading…');
    }
  };
  const poll = async () => {
    if (stopped) return;
    try {
      const resp = await fetch(apiUrl(`/api/preview-status/${vid}`));
      if (resp.ok) {
        const d = await resp.json();
        state = d.state;
        deadline = d.state === 'waiting' && d.wait != null ? Date.now() + d.wait * 1000 : null;
      }
    } catch (e) { /* keep the last state */ }
    show();
    if (!stopped && state !== 'ready' && state !== 'error') timer = setTimeout(poll, 1500);
  };
  show();
  poll();
  ticker = setInterval(show, 250);
  return () => { stopped = true; clearTimeout(timer); clearInterval(ticker); };
}

// ---------- Song page ----------
// One song picked in search. The header shows the search row right away;
// the server looks it up (album, audio, lyrics) and the rows fill in as
// results land. Questions (album, wrong song) only appear when it's unsure.
const sp = id => document.getElementById(id);
const spAudio = sp('spAudio');
const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';
const PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
let songJobId = null;
let songPick = null; // the search row tapped (instant header)
let songJob = null;
let songTimer = null;
let songAudioVid = null;
let songFixTouched = false;
let songAlbumOpen = false;
let songAltsOpen = false;
let songIdlePolls = 0;
let songCountdownStop = null;

function stopSongCountdown() {
  if (songCountdownStop) { songCountdownStop(); songCountdownStop = null; }
}

function startSongCountdown(vid) {
  stopSongCountdown();
  songCountdownStop = previewCountdown(vid, text => { sp('spTime').textContent = text; });
}

function isSongJob(job) {
  return job && job.tracks.length === 1 && job.tracks[0].confidence === 'catalog' && !job.album_hint;
}

function leaveSong() {
  clearTimeout(songTimer);
  stopSongCountdown();
  if (!spAudio.paused && spAudio.src && typeof miniPlay === 'function') {
    // Still playing: carry on in the mini-player.
    const t = songJob && songJob.tracks[0];
    const m = (t && t.match) || {};
    miniPlay({ src: spAudio.src, title: m.title || (t && t.title) || sp('spTitle').textContent, artist: m.artist || (t && t.artist) || sp('spArtist').textContent,
               album: m.album || '', artwork: (sp('spHero').querySelector('img') || {}).src || '', startAt: spAudio.currentTime });
  }
  if (!spAudio.paused) spAudio.pause();
}

function resetSongPage() {
  songJob = null;
  songAudioVid = null;
  songFixTouched = false;
  songAlbumOpen = false;
  songAltsOpen = false;
  spAudio.removeAttribute('src');
  spAudio.load();
  sp('spSeek').value = 0;
  sp('spTime').textContent = '';
  sp('spPlay').innerHTML = PLAY_ICON;
  sp('spAlts').classList.add('hidden');
  sp('spAlbumPicker').classList.add('hidden');
  sp('spAlbumChangeRow').classList.add('hidden');
  sp('spFix').style.display = 'none';
  sp('spProgress').classList.add('hidden');
}

function setHero(url, fallback, heroId = 'spHero', icon = '🎵') {
  const hero = sp(heroId);
  const cur = hero.querySelector('img');
  if (cur && cur.dataset.src === url) return;
  hero.innerHTML = '';
  const ph = `<div class="ph">${icon}</div>`;
  if (!url) { hero.innerHTML = ph; return; }
  const img = document.createElement('img');
  img.dataset.src = url;
  img.src = url;
  img.onerror = () => { if (fallback && fallback !== url) setHero(fallback, null, heroId, icon); else hero.innerHTML = ph; };
  hero.appendChild(img);
}

function setHeader(title, artist, parts, explicit) {
  sp('spTitle').textContent = title || '';
  sp('spArtist').textContent = artist || '';
  const meta = sp('spMeta');
  meta.innerHTML = '';
  if (explicit) {
    const e = document.createElement('span');
    e.className = 'explicit';
    e.textContent = 'E';
    meta.appendChild(e);
  }
  meta.appendChild(document.createTextNode(parts.filter(Boolean).join(' · ')));
}

async function openSong(r) {
  songPick = r;
  resetSongPage();
  showView('song');
  setHero(r.artwork, null);
  setHeader(r.title, r.artist, [r.album, r.year, fmtDuration(r.duration)], r.explicit);
  renderSongLoading('Looking up…');
  try {
    const resp = await fetch(apiUrl('/api/jobs/catalog'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ song: {
        title: r.title, artist: r.artist, album: r.album || '', duration: r.duration,
        explicit: r.explicit, video_id: r.video_id || null, artwork: r.artwork || null, year: r.year || null,
      } }),
    });
    if (!resp.ok) throw new Error(await errorDetail(resp));
    const job = await resp.json();
    songJobId = job.id;
    renderSong(job);
    pollSongFresh();
  } catch (e) {
    showSongProgress('Couldn\'t start: ' + e.message, 'bad');
  }
}

function openSongJob(jobId) {
  songPick = null;
  songJobId = jobId;
  resetSongPage();
  showView('song');
  renderSongLoading('');
  pollSongFresh();
}

function renderSongLoading(text) {
  ['spAlbum', 'spTrack', 'spGenre', 'spLyrics'].forEach(id => { sp(id).textContent = ''; });
  ['spAlbumState', 'spTrackState', 'spGenreState', 'spLyricsState'].forEach(id => { sp(id).innerHTML = '<span class="mini-spin"></span>'; sp(id).className = 'd-state'; });
  sp('spSource').textContent = 'Finding the album audio…';
  sp('spChange').classList.add('hidden');
  sp('spLyricsText').classList.add('hidden');
  sp('spAddLib').disabled = true;
  sp('spAddPl').disabled = true;
  if (text) showSongProgress(text, '');
}

function showSongProgress(text, cls) { showProgress('spProgress', text, cls); }

function showProgress(id, text, cls) {
  const el = sp(id);
  el.textContent = text;
  el.className = 'sp-progress' + (cls ? ' ' + cls : '');
  el.classList.toggle('hidden', !text);
}

function pollSongFresh() { songIdlePolls = 0; pollSong(); }

async function pollSong() {
  clearTimeout(songTimer);
  if (!songJobId || songView.classList.contains('hidden')) return;
  const id = songJobId;
  let job = null;
  try {
    const resp = await fetch(apiUrl(`/api/jobs/${id}`));
    if (resp.status === 404) { showSongProgress('This song is no longer on the server (tuberipper restarted). Go back and tap it again.', 'bad'); return; }
    if (resp.ok) job = await resp.json();
  } catch (e) { /* phone network blip: keep trying */ }
  if (id !== songJobId) return;
  if (job) renderSong(job);
  const t = job && job.tracks[0];
  // Waiting for the user: keep polling only until the background lyrics /
  // cover fetch has landed (or gave up -- capped so it can't poll forever).
  if (job && job.status === 'awaiting_confirmation') songIdlePolls++; else songIdlePolls = 0;
  const settled = job && (['done', 'cancelled', 'error'].includes(job.status)
    || (job.status === 'awaiting_confirmation' && !job.phase && !job.refining && (t.lyrics_preview || t.quality === 'none'))
    || songIdlePolls > 30);
  if (!settled) songTimer = setTimeout(pollSong, job && job.status === 'processing' ? 1200 : 2000);
}

function setState(id, state) {
  const el = sp(id);
  el.className = 'd-state' + (state === 'ok' ? ' ok' : state === 'warn' ? ' warn' : '');
  el.innerHTML = state === 'busy' ? '<span class="mini-spin"></span>' : state === 'ok' ? '✓' : state === 'warn' ? '!' : '';
}

function renderSong(job) {
  songJob = job;
  const t = job.tracks[0];
  const m = t.match || {};
  const cat = t.catalog || {};
  // Before the match is stored every row is still loading; after it, the
  // audio search runs (finding_audio -> audio_found) until the job pauses.
  const lookingUp = !t.match && job.status === 'processing';
  const findingAudio = lookingUp || (job.status === 'processing' && ['looked_up', 'finding_audio'].includes(t.status));
  const waiting = job.status === 'awaiting_confirmation';

  // Header: the lookup's answer once there is one, else the search row.
  const target = t.target_duration || m.duration;
  if (!lookingUp && m.title) {
    setHeader(m.title, m.artist || t.artist, [m.album, m.year, fmtDuration(target)], t.explicit);
    setHero(m.artwork_url || cat.artwork, cat.artwork);
  } else if (!songPick) {
    setHeader(t.title, t.artist, [cat.album, cat.year, fmtDuration(target)], t.explicit);
    setHero(cat.artwork, null);
  }

  // Audio
  const st = sourceText(t);
  sp('spSource').textContent = findingAudio ? 'Finding the album audio…' : st.text;
  sp('spSource').className = 'src-text' + (!findingAudio && st.cls ? ' src-' + st.cls : '');
  const vid = t.use_original ? t.id : (t.source && t.source.video_id);
  const canPlay = !findingAudio && !!vid;
  sp('spPlay').disabled = !canPlay;
  sp('spSeek').disabled = !canPlay;
  if (vid !== songAudioVid && songAudioVid) {
    stopSongCountdown();
    spAudio.pause();
    spAudio.removeAttribute('src');
    spAudio.load();
    sp('spPlay').innerHTML = PLAY_ICON;
    sp('spSeek').value = 0;
  }
  songAudioVid = vid || null;
  if (!sp('spTime').textContent || !spAudio.src) sp('spTime').textContent = target ? `0:00 / ${fmtDuration((t.source && t.source.duration) || target)}` : '';
  sp('spChange').classList.toggle('hidden', !waiting);

  // Album
  // The most likely album is always used; MusicBrainz may still correct
  // Deezer's first answer (job.refining), then other albums can be picked.
  const cands = job.album_candidates || [];
  if (lookingUp) {
    setState('spAlbumState', 'busy');
    sp('spAlbum').textContent = cat.album || '';
  } else {
    sp('spAlbum').textContent = m.album || 'No album found';
    setState('spAlbumState', job.refining ? 'busy' : (!m.album ? 'warn' : 'ok'));
  }
  const canPick = waiting && !job.refining && cands.length > 1;
  sp('spAlbumChangeRow').classList.toggle('hidden', !canPick);
  sp('spAlbumChange').textContent = songAlbumOpen ? 'Done' : 'Pick a different album';
  sp('spAlbumPicker').classList.toggle('hidden', !(canPick && songAlbumOpen));
  if (canPick && songAlbumOpen) renderSongAlbums(job, false);

  // Track / genre
  if (lookingUp) { setState('spTrackState', 'busy'); setState('spGenreState', 'busy'); sp('spTrack').textContent = ''; sp('spGenre').textContent = ''; }
  else {
    sp('spTrack').textContent = m.track_number ? `${m.disc_number > 1 ? m.disc_number + '-' : ''}${m.track_number}` : '—';
    setState('spTrackState', m.track_number ? 'ok' : '');
    const genre = m.genre || '';
    const genreBusy = waiting && !genre && !t.lyrics_preview && m.album;
    sp('spGenre').textContent = genre || (genreBusy ? '' : (m.genre_hint || '—'));
    setState('spGenreState', genreBusy ? 'busy' : (genre || m.genre_hint ? 'ok' : ''));
  }

  // Lyrics
  const lp = t.lyrics_preview;
  const lyricsDone = t.lyrics; // after download: what was actually saved
  if (lyricsDone) {
    sp('spLyrics').textContent = { synced: 'Synced', plain: 'Plain (no timing)', none: 'None found' }[lyricsDone] || lyricsDone;
    setState('spLyricsState', lyricsDone === 'synced' ? 'ok' : lyricsDone === 'none' ? '' : 'warn');
  } else if (!lp) {
    sp('spLyrics').textContent = (!lookingUp && !m.album) ? '—' : '';
    setState('spLyricsState', (!lookingUp && !m.album) ? '' : 'busy');
  } else {
    sp('spLyrics').textContent = { synced: 'Synced', plain: 'Plain (no timing)', none: 'None found' }[lp.kind] || '—';
    setState('spLyricsState', lp.kind === 'synced' ? 'ok' : lp.kind === 'plain' ? 'warn' : '');
  }
  const lyr = sp('spLyricsText');
  lyr.classList.toggle('hidden', !(lp && lp.lines && lp.lines.length));
  if (lp && lp.lines) lyr.textContent = lp.lines.join('\n');
  lyr.style.whiteSpace = 'pre-line';

  // Wrong song / not found
  const unsure = waiting && (t.quality === 'weak' || t.quality === 'none');
  if (unsure || (waiting && songFixTouched)) {
    if (sp('spFix').style.display === 'none') {
      sp('spFixArtist').value = t.artist;
      sp('spFixTitleInput').value = t.title;
    }
    sp('spFix').style.display = 'block';
    sp('spFixTitle').textContent = t.quality === 'none' ? 'Couldn\'t find this song' : (unsure ? 'Is this the right song?' : 'Look it up differently');
    sp('spFixWhy').textContent = t.quality === 'none'
      ? 'Check the artist and title, then look it up again.'
      : (unsure ? `Found “${m.artist || '?'} — ${m.title || '?'}”. Fix the artist or title if that's wrong.` : 'Change the artist or title and look it up again.');
  } else if (!songFixTouched) {
    sp('spFix').style.display = 'none';
  }
  sp('spWrong').classList.toggle('hidden', !waiting || unsure);

  renderSongActions(job);
  if (!spAudio.paused && spAudio.src) setNowPlaying(songNowInfo(), spAudio);
}

function renderSongActions(job) {
  const t = job.tracks[0];
  const waiting = job.status === 'awaiting_confirmation';
  const lib = sp('spAddLib'), pl = sp('spAddPl');
  if (job.status === 'processing' && PHASE2_STATUSES.includes(t.status)) {
    lib.disabled = pl.disabled = true;
    showSongProgress({ queued_download: 'Starting download…', downloading: 'Downloading…', tagging: 'Tagging…', fetching_lyrics: 'Saving lyrics…' }[t.status]
      || (job.playlist_status || 'Finishing up…'), '');
    return;
  }
  if (job.status === 'processing') {
    lib.disabled = pl.disabled = true;
    showSongProgress(job.phase ? job.phase + '…' : (t.status === 'finding_audio' ? 'Finding the album audio…' : 'Looking up…'), '');
    return;
  }
  if (job.status === 'done') {
    lib.disabled = true;
    pl.disabled = true;
    lib.textContent = '✓ In your library';
    if (t.status === 'failed') {
      showSongProgress('Download failed: ' + (t.detail || 'unknown error'), 'bad');
      lib.textContent = 'Try again';
      lib.disabled = false;
      lib.onclick = retrySong;
      return;
    }
    const msg = t.status === 'skipped_exists' ? 'Already in your library.' : 'Added to your library.';
    const plMsg = job.playlist_error || job.playlist_status || '';
    showSongProgress(msg + (plMsg ? ' ' + plMsg : '') + (t.lyrics === 'synced' ? ' Synced lyrics saved.' : ''), job.playlist_error ? 'bad' : 'ok');
    return;
  }
  if (job.status === 'error') {
    lib.disabled = pl.disabled = true;
    showSongProgress(job.error || 'Something went wrong.', 'bad');
    return;
  }
  if (waiting) {
    const nothing = !t.source && !(t.use_original && t.url);
    lib.onclick = () => addSong('none');
    lib.textContent = t.existing ? '✓ In your library' : 'Add to Library';
    lib.disabled = nothing || !!t.existing;
    pl.disabled = nothing;
    showSongProgress(nothing ? 'No upload of this song found on YouTube. Try "Wrong song?" with a different title.'
      : (t.existing ? 'Already in your library — you can still add it to a playlist.'
        : (job.refining ? 'Checking which album it\'s from… you can add it already.' : '')), nothing ? 'bad' : '');
  }
}

function renderSongAlbums(job, unsure) {
  sp('spAlbumHint').textContent = unsure
    ? 'Not sure which album this is from. The highlighted one is used unless you tap another.'
    : 'Tap an album to file the song under it.';
  renderAlbumOptions(sp('spAlbumGrid'), job, songJobId, picked => {
    songAlbumOpen = false;
    renderSong(picked);
    pollSongFresh(); // lyrics/art for the new album arrive in the background
  });
}

// The album choices as a cover grid; tapping one files the job's songs
// under it (pick-album) and hands the updated job to onPicked.
function renderAlbumOptions(grid, job, jobId, onPicked) {
  grid.innerHTML = '';
  const chosen = job.selected_album_id || job.guess_album_id;
  (job.album_candidates || []).forEach(c => {
    const opt = document.createElement('button');
    opt.type = 'button';
    opt.className = 'album-opt' + (c.collection_id === chosen ? ' selected' : '');
    const ph = document.createElement('div');
    ph.className = 'ph';
    ph.textContent = '💿';
    if (c.artwork_url) {
      const img = document.createElement('img');
      img.src = c.artwork_url;
      img.loading = 'lazy';
      img.onerror = () => img.replaceWith(ph);
      opt.appendChild(img);
    } else opt.appendChild(ph);
    const name = document.createElement('div');
    name.className = 'a-name';
    name.textContent = c.album;
    opt.appendChild(name);
    const meta = document.createElement('div');
    meta.className = 'a-meta';
    meta.textContent = [c.kind, c.year].filter(Boolean).join(' · ');
    opt.appendChild(meta);
    opt.addEventListener('click', async () => {
      if (c.collection_id === job.selected_album_id) return;
      opt.classList.add('busy');
      try {
        const resp = await fetch(apiUrl(`/api/jobs/${jobId}/pick-album`), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ collection_id: c.collection_id }),
        });
        if (!resp.ok) throw new Error(await errorDetail(resp));
        onPicked(await resp.json());
      } catch (e) {
        opt.classList.remove('busy');
        alert('Couldn\'t switch album: ' + e.message);
      }
    });
    grid.appendChild(opt);
  });
}

sp('spAlbumChange').addEventListener('click', () => { songAlbumOpen = !songAlbumOpen; if (songJob) renderSong(songJob); });

// Player
sp('spPlay').innerHTML = PLAY_ICON;
sp('spPlay').addEventListener('click', () => {
  if (!songAudioVid) return;
  if (miniInfo) miniStop();
  if (!spAudio.src) {
    spAudio.src = apiUrl(`/api/preview/${songAudioVid}`);
    startSongCountdown(songAudioVid);
  }
  if (spAudio.paused) spAudio.play().catch(e => { sp('spTime').textContent = 'Can\'t play'; });
  else spAudio.pause();
});
spAudio.addEventListener('play', () => { sp('spPlay').innerHTML = PAUSE_ICON; });
spAudio.addEventListener('playing', () => {
  setNowPlaying(songNowInfo(), spAudio);
  stopSongCountdown();
  if (spAudio.duration && isFinite(spAudio.duration)) sp('spTime').textContent = `${fmtDuration(spAudio.currentTime)} / ${fmtDuration(spAudio.duration)}`;
});
spAudio.addEventListener('pause', () => { sp('spPlay').innerHTML = PLAY_ICON; });
spAudio.addEventListener('ended', () => { sp('spPlay').innerHTML = PLAY_ICON; });
spAudio.addEventListener('error', () => { stopSongCountdown(); if (spAudio.src) sp('spTime').textContent = 'Preview failed'; sp('spPlay').innerHTML = PLAY_ICON; });
spAudio.addEventListener('timeupdate', () => {
  const d = spAudio.duration;
  if (!d || !isFinite(d) || songCountdownStop) return;
  if (!seeking) sp('spSeek').value = Math.round((spAudio.currentTime / d) * 1000);
  sp('spTime').textContent = `${fmtDuration(spAudio.currentTime)} / ${fmtDuration(d)}`;
});
let seeking = false;
sp('spSeek').addEventListener('input', () => { seeking = true; });
sp('spSeek').addEventListener('change', () => {
  seeking = false;
  if (!spAudio.src) { sp('spPlay').click(); return; }
  const d = spAudio.duration;
  if (d && isFinite(d)) spAudio.currentTime = (sp('spSeek').value / 1000) * d;
});

// Other uploads
sp('spChange').addEventListener('click', async () => {
  const box = sp('spAlts');
  songAltsOpen = !songAltsOpen;
  box.classList.toggle('hidden', !songAltsOpen);
  sp('spChange').textContent = songAltsOpen ? 'Done' : 'Change';
  if (!songAltsOpen) return;
  box.innerHTML = '<div class="spinner" style="margin:12px auto;"></div>';
  try {
    const resp = await fetch(apiUrl(`/api/jobs/${songJobId}/tracks/0/sources`));
    if (!resp.ok) throw new Error(await errorDetail(resp));
    renderAlts(await resp.json());
  } catch (e) {
    box.innerHTML = '';
    box.textContent = 'Couldn\'t load other uploads: ' + e.message;
  }
});

function renderAlts(alts) {
  const box = sp('spAlts');
  box.innerHTML = '';
  if (!alts.length) { box.innerHTML = '<div class="hint">No other uploads found.</div>'; return; }
  const t = songJob.tracks[0];
  const current = t.use_original ? t.id : (t.source && t.source.video_id);
  alts.forEach(a => {
    const row = document.createElement('div');
    row.className = 'src-row';
    const body = document.createElement('div');
    body.className = 'src-body';
    const name = document.createElement('div');
    name.className = 'src-title';
    name.textContent = a.title || '(untitled)';
    body.appendChild(name);
    const info = document.createElement('div');
    const off = a.diff != null && a.ok === false ? ` (${signedSeconds(a.diff)} vs album)` : '';
    info.className = 'src-text' + (a.ok === true ? ' src-ok' : a.ok === false ? ' src-warn' : '');
    info.textContent = `${a.ok === true ? '✓ ' : a.ok === false ? '⚠ ' : ''}${SOURCE_LABEL[a.kind] || 'Upload'} · ${fmtDuration(a.duration)}${off}${a.artist ? ' · ' + a.artist : ''}`;
    body.appendChild(info);
    row.appendChild(body);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'link';
    btn.textContent = a.video_id === current ? 'Using' : 'Use';
    btn.disabled = a.video_id === current;
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const resp = await fetch(apiUrl(`/api/jobs/${songJobId}/tracks/0/source`), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ video_id: a.video_id }),
        });
        if (!resp.ok) throw new Error(await errorDetail(resp));
        const job = await resp.json();
        renderSong(job);
        renderAlts(alts);
        spAudio.src = apiUrl(`/api/preview/${a.video_id}`);
        startSongCountdown(a.video_id);
        spAudio.play().catch(() => {});
      } catch (e) {
        btn.disabled = false;
        alert('Couldn\'t switch: ' + e.message);
      }
    });
    row.appendChild(btn);
    box.appendChild(row);
  });
}

sp('spFixBtn').addEventListener('click', async () => {

// Add to library / playlist
async function addSong(mode, name, playlistId) {
  sp('spAddLib').disabled = sp('spAddPl').disabled = true;
  showSongProgress('Starting download…', '');
  try {
    const resp = await fetch(apiUrl(`/api/jobs/${songJobId}/confirm-match`), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'accept', playlist_mode: mode, playlist_name: name || null, playlist_id: playlistId || null }),
    });
    if (!resp.ok) throw new Error(await errorDetail(resp));
    renderSong(await resp.json());
    pollSongFresh();
  } catch (e) {
    showSongProgress('Couldn\'t start the download: ' + e.message, 'bad');
    if (songJob) renderSongActions(songJob);
  }
}

async function retrySong() {
  sp('spAddLib').disabled = true;
  try {
    const resp = await fetch(apiUrl(`/api/jobs/${songJobId}/retry-failed`), { method: 'POST' });
    if (!resp.ok) throw new Error(await errorDetail(resp));
    renderSong(await resp.json());
    pollSongFresh();
  } catch (e) {
    showSongProgress('Couldn\'t retry: ' + e.message, 'bad');
    sp('spAddLib').disabled = false;
  }
}

sp('spAddPl').addEventListener('click', () => openPlaylistSheet());

// ---------- Lock screen / Control Center ("now playing") ----------
// Every player (song page, album page, mini-player) tells the system what
// it's playing when playback starts; otherwise the lock screen keeps the
// title and cover of whatever set them last.
function setNowPlaying(info, audio) {
  if (!('mediaSession' in navigator)) return;
  const ms = navigator.mediaSession;
  try {
    const art = info.artwork ? new URL(info.artwork, location.href).href : '';
    ms.metadata = new MediaMetadata({
      title: info.title || '', artist: info.artist || '', album: info.album || '',
      artwork: art ? [{ src: art, sizes: '96x96' }, { src: art, sizes: '256x256' }, { src: art, sizes: '512x512' }] : [],
    });
    ms.playbackState = audio.paused ? 'paused' : 'playing';
    ms.setActionHandler('play', () => audio.play().catch(() => {}));
    ms.setActionHandler('pause', () => audio.pause());
    ms.setActionHandler('seekto', d => { if (d.seekTime != null && isFinite(audio.duration)) audio.currentTime = d.seekTime; });
    ms.setActionHandler('seekbackward', d => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); });
    ms.setActionHandler('seekforward', d => { audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + (d.seekOffset || 10)); });
    const hasNext = audio === miniAudio && miniQueue && miniIdx + 1 < miniQueue.length;
    const hasPrev = audio === miniAudio && miniQueue && miniIdx > 0;
    ms.setActionHandler('nexttrack', hasNext ? () => miniAdvance() : null);
    ms.setActionHandler('previoustrack', hasPrev ? () => miniPlayList(miniQueue, miniIdx - 1) : null);
  } catch (e) { /* older browsers */ }
}

// Runs once at the end of the script, when all three players exist.
function installNowPlayingListeners() {
[spAudio, apAudio, miniAudio].forEach(a => {
  a.addEventListener('timeupdate', () => {
    if (a.paused || !('mediaSession' in navigator) || !a.duration || !isFinite(a.duration)) return;
    try { navigator.mediaSession.setPositionState({ duration: a.duration, position: Math.min(a.currentTime, a.duration), playbackRate: 1 }); } catch (e) { /* ignore */ }
  });
  a.addEventListener('pause', () => { if ('mediaSession' in navigator && !a.ended) { try { navigator.mediaSession.playbackState = 'paused'; } catch (e) { /* ignore */ } } });
  a.addEventListener('play', () => { if ('mediaSession' in navigator) { try { navigator.mediaSession.playbackState = 'playing'; } catch (e) { /* ignore */ } } });
});
}

function songNowInfo() {
  const t = songJob && songJob.tracks[0];
  const m = (t && t.match) || {};
  return { title: m.title || (t && t.title) || sp('spTitle').textContent, artist: m.artist || (t && t.artist) || sp('spArtist').textContent,
           album: m.album || '', artwork: (sp('spHero').querySelector('img') || {}).src || '' };
}

function albumNowInfo() {
  const t = (albumJob && albumJob.tracks.find(x => x.index === albumPlaying)) || {};
  return { title: t.title || '', artist: t.artist || '', album: ap('apTitle').textContent,
           artwork: (ap('apHero').querySelector('img') || {}).src || '' };
}

// ---------- Mini-player ----------
// Keeps a preview (or a library song) playing while you browse. Leaving a
// song/album page while its preview plays hands it over to this bar.
const miniAudio = document.getElementById('miniAudio');
let miniCountdownStop = null;
let miniInfo = null;
let miniQueue = null; // songs to play one after another (an album, a playlist)
let miniIdx = 0;

function miniVisible() {
  const onPage = !songView.classList.contains('hidden') || !albumView.classList.contains('hidden');
  document.body.classList.toggle('has-mini', !!miniInfo && !onPage);
}

function miniPlayList(list, i) {
  miniQueue = list;
  miniIdx = i;
  miniPlay(list[i], true);
}

function miniAdvance() {
  if (miniQueue && miniIdx + 1 < miniQueue.length) miniPlayList(miniQueue, miniIdx + 1);
}

function miniPlay(info, keepQueue = false) {
  if (!keepQueue) miniQueue = null;
  document.getElementById('miniNext').style.display = miniQueue && miniIdx + 1 < miniQueue.length ? '' : 'none';
  if (!spAudio.paused) spAudio.pause();
  if (!apAudio.paused) apAudio.pause();
  if (miniCountdownStop) { miniCountdownStop(); miniCountdownStop = null; }
  miniInfo = info;
  document.getElementById('miniTitle').textContent = info.title || '';
  document.getElementById('miniSub').textContent = [info.artist, info.album].filter(Boolean).join(' · ');
  const art = document.getElementById('miniArt');
  art.innerHTML = '<div class="ph">🎵</div>';
  if (info.artwork) {
    const img = document.createElement('img');
    img.src = info.artwork;
    img.onerror = () => { art.innerHTML = '<div class="ph">🎵</div>'; };
    img.onload = () => { art.innerHTML = ''; art.appendChild(img); };
  }
  miniAudio.src = info.src;
  if (info.startAt) miniAudio.addEventListener('loadedmetadata', () => { miniAudio.currentTime = info.startAt; }, { once: true });
  if (info.vid && !info.startAt) {
    miniCountdownStop = previewCountdown(info.vid, text => { document.getElementById('miniSub').textContent = text; });
  }
  miniAudio.play().catch(() => {});
  setNowPlaying(info, miniAudio);
  miniVisible();
}

function miniStop() {
  if (miniCountdownStop) { miniCountdownStop(); miniCountdownStop = null; }
  miniAudio.pause();
  miniAudio.removeAttribute('src');
  miniAudio.load();
  miniInfo = null;
  miniQueue = null;
  if ('mediaSession' in navigator) { try { navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = 'none'; } catch (e) { /* ignore */ } }
  miniVisible();
}

document.getElementById('miniPlay').innerHTML = PLAY_ICON;
document.getElementById('miniPlay').addEventListener('click', () => {
  if (!miniInfo) return;
  if (miniAudio.paused) miniAudio.play().catch(() => {}); else miniAudio.pause();
});
document.getElementById('miniClose').addEventListener('click', miniStop);
miniAudio.addEventListener('play', () => { document.getElementById('miniPlay').innerHTML = PAUSE_ICON; });
miniAudio.addEventListener('pause', () => { document.getElementById('miniPlay').innerHTML = PLAY_ICON; });
miniAudio.addEventListener('ended', () => { document.getElementById('miniPlay').innerHTML = PLAY_ICON; miniAdvance(); });
document.getElementById('miniNext').addEventListener('click', miniAdvance);

miniAudio.addEventListener('playing', () => {
  if (miniCountdownStop) { miniCountdownStop(); miniCountdownStop = null; }
  if (miniInfo) document.getElementById('miniSub').textContent = [miniInfo.artist, miniInfo.album].filter(Boolean).join(' · ');
});
miniAudio.addEventListener('timeupdate', () => {
  const d = miniAudio.duration;
  document.getElementById('miniProgress').style.width = d && isFinite(d) ? `${(miniAudio.currentTime / d) * 100}%` : '0';
});
miniAudio.addEventListener('error', () => {
  if (!miniAudio.getAttribute('src')) return;
  if (miniCountdownStop) { miniCountdownStop(); miniCountdownStop = null; }
  document.getElementById('miniSub').textContent = 'Couldn\'t play this';
});

// ---------- Album page ----------
// An album picked in search: its songs are listed at once (each with a
// tick box and a preview button) and looked up straight away; Add to
// Library / Add to Playlist then download the ticked ones.
const ap = id => document.getElementById(id);
const apAudio = ap('apAudio');
let albumJobId = null;
let albumJob = null;
let albumPick = null;
let albumTimer = null;
let albumAlbumOpen = false;
let albumPlaying = null; // index of the song whose preview is loaded
let albumEdits = 0;
let albumCountdown = null; // {index, text, stop} while a preview is loading // bumped on every tick change: older poll answers are stale

function isAlbumJob(job) {
  return !!(job && (job.url || '').startsWith('catalog-album:'));
}

function leaveAlbum() {
  clearTimeout(albumTimer);
  stopAlbumCountdown();
  if (!apAudio.paused && apAudio.src && albumJob && albumPlaying != null && typeof miniPlay === 'function') {
    const t = albumJob.tracks.find(x => x.index === albumPlaying) || {};
    miniPlay({ src: apAudio.src, title: t.title, artist: t.artist, album: ap('apTitle').textContent,
               artwork: (ap('apHero').querySelector('img') || {}).src || '', startAt: apAudio.currentTime });
  }
  if (!apAudio.paused) apAudio.pause();
}

function resetAlbumPage() {
  albumJob = null;
  albumAlbumOpen = false;
  albumPlaying = null;
  apAudio.removeAttribute('src');
  apAudio.load();
  ap('apTracks').innerHTML = '<div class="spinner"></div>';
  ap('apCount').textContent = '';
  ap('apAlbum').textContent = '';
  ap('apGenre').textContent = '';
  ap('apAlbumPicker').classList.add('hidden');
  ap('apAlbumPicker').dataset.autoOpened = '';
  ap('apAlbumChangeRow').classList.add('hidden');
  ap('apAddLib').disabled = ap('apAddPl').disabled = true;
  ap('apAddLib').textContent = 'Add to Library';
  showAlbumProgress('', '');
}

function setAlbumHeader(title, artist, parts) {
  ap('apTitle').textContent = title || '';
  ap('apArtist').textContent = artist || '';
  ap('apMeta').textContent = parts.filter(Boolean).join(' · ');
}

function showAlbumProgress(text, cls) { showProgress('apProgress', text, cls); }
function setAlbumHero(url) { setHero(url, null, 'apHero', '💿'); }

async function openAlbum(r) {
  albumPick = r;
  albumJobId = null;
  resetAlbumPage();
  showView('album');
  setAlbumHero(r.artwork);
  setAlbumHeader(r.title, r.artist, [r.year, r.track_count ? `${r.track_count} songs` : '']);
  showAlbumProgress('Loading the songs…', '');
  try {
    const resp = await fetch(apiUrl('/api/jobs/catalog'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ album: { title: r.title, artist: r.artist, ytm_browse_id: r.ytm_browse_id || null, itunes_id: r.itunes_id || null } }),
    });
    if (!resp.ok) throw new Error(await errorDetail(resp));
    let job = await resp.json();
    albumJobId = job.id;
    renderAlbum(job);
    // Look the songs up right away; ticking/unticking still works meanwhile.
    const start = await fetch(apiUrl(`/api/jobs/${job.id}/start`), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ playlist_mode: 'none' }),
    });
    if (!start.ok) throw new Error(await errorDetail(start));
    renderAlbum(await start.json());
    pollAlbum();
  } catch (e) {
    if (!albumJob) ap('apTracks').innerHTML = '';
    showAlbumProgress('Couldn\'t load this album: ' + e.message, 'bad');
  }
}

function openAlbumJob(jobId) {
  albumPick = null;
  albumJobId = jobId;
  resetAlbumPage();
  showView('album');
  pollAlbum();
}

async function pollAlbum() {
  clearTimeout(albumTimer);
  if (!albumJobId || albumView.classList.contains('hidden')) return;
  const id = albumJobId;
  const edits = albumEdits;
  let job = null;
  try {
    const resp = await fetch(apiUrl(`/api/jobs/${id}`));
    if (resp.status === 404) { showAlbumProgress('This album is no longer on the server (tuberipper restarted). Go back and tap it again.', 'bad'); return; }
    if (resp.ok) job = await resp.json();
  } catch (e) { /* network blip: keep trying */ }
  if (id !== albumJobId) return;
  if (edits !== albumEdits) { albumTimer = setTimeout(pollAlbum, 300); return; } // a tick changed meanwhile: ask again
  if (job) renderAlbum(job);
  const settled = job && (['done', 'cancelled', 'error'].includes(job.status) || (job.status === 'awaiting_confirmation' && !job.phase && !job.refining));
  if (!settled) albumTimer = setTimeout(pollAlbum, job && job.status === 'processing' ? 1200 : 2000);
}

function albumTrackVid(t) {
  return (t.use_original ? t.id : (t.source && t.source.video_id)) || t.id || null;
}

const ALBUM_TRACK_STATUS = {
  queued_lookup: 'Waiting…', looking_up: 'Looking up…', looked_up: 'Finding the album audio…', finding_audio: 'Finding the album audio…',
  audio_found: '', queued_download: 'Waiting to download…', downloading: 'Downloading…', tagging: 'Tagging…',
  fetching_lyrics: 'Saving lyrics…', done: '✓ Saved', skipped_exists: '✓ Already in your library', skipped_not_accepted: 'Skipped',
  skipped_cancelled: 'Cancelled',
};

function albumTrackSub(job, t) {
  const m = t.match || {};
  if (t.status === 'failed') return { cls: 'bad', text: 'Failed: ' + (t.detail || 'unknown error') };
  if (t.status === 'done') return { cls: 'ok', text: '✓ Saved' + (t.lyrics === 'synced' ? ' · synced lyrics' : '') };
  if (t.status === 'skipped_exists') return { cls: 'ok', text: '✓ Already in your library' };
  if (t.status === 'awaiting_confirmation') {
    if (t.existing) return { cls: 'ok', text: '✓ Already in your library' };
    if (t.quality === 'none') return { cls: 'warn', text: '⚠ Not found' };
    if (t.quality === 'weak') return { cls: 'warn', text: `⚠ Unsure: ${m.artist || '?'} — ${m.title || '?'}` };
    const st = sourceText(t);
    return { cls: st.cls, text: st.cls === 'ok' ? st.text.split(' · ')[0] : st.text };
  }
  if (t.status === 'ready' || t.status === 'pending') return { cls: '', text: '' };
  return { cls: '', text: ALBUM_TRACK_STATUS[t.status] ?? '' };
}

function renderAlbum(job) {
  albumJob = job;
  const tracks = job.tracks;
  const first = tracks[0] || {};
  const cat = first.catalog || {};
  const waiting = job.status === 'awaiting_confirmation';
  const editable = ['ready', 'processing', 'awaiting_confirmation'].includes(job.status)
    && !tracks.some(t => PHASE2_STATUSES.includes(t.status));

  // Header: the search row, else what the server knows about the album.
  const matched = tracks.map(t => t.match).filter(m => m && m.album);
  const top = matched.length ? matched[0] : null;
  if (!albumPick) {
    setAlbumHeader(cat.album || (top && top.album), cat.album_artist || (top && (top.album_artist || top.artist)) || first.artist,
      [cat.year || (top && top.year), `${tracks.length} songs`]);
  }
  setAlbumHero((albumPick && albumPick.artwork) || cat.artwork || (top && top.artwork_url) || '');

  // Album / genre rows
  const cands = job.album_candidates || [];
  if (!matched.length) {
    ap('apAlbum').textContent = job.status === 'processing' || job.status === 'ready' ? (cat.album || '') : 'No album found';
    setState('apAlbumState', ['processing', 'ready'].includes(job.status) ? 'busy' : 'warn');
    ap('apGenre').textContent = '';
    setState('apGenreState', ['processing', 'ready'].includes(job.status) ? 'busy' : '');
  } else {
    const counts = {};
    matched.forEach(m => { counts[m.album] = (counts[m.album] || 0) + 1; });
    const album = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    const m0 = matched.find(m => m.album === album);
    ap('apAlbum').textContent = [album, m0.year].filter(Boolean).join(' · ');
    const split = Object.keys(counts).length > 1;
    setState('apAlbumState', job.refining ? 'busy' : (split ? 'warn' : 'ok'));
    const genre = (matched.find(m => m.genre) || {}).genre || m0.genre_hint || '';
    ap('apGenre').textContent = genre || '—';
    setState('apGenreState', genre ? 'ok' : '');
  }
  const canPick = waiting && !job.refining && cands.length > 1;
  ap('apAlbumChangeRow').classList.toggle('hidden', !canPick);
  ap('apAlbumChange').textContent = albumAlbumOpen ? 'Done' : 'Pick a different album';
  ap('apAlbumPicker').classList.toggle('hidden', !(canPick && albumAlbumOpen));
  if (canPick && albumAlbumOpen) renderAlbumCandidates(job);

  // Tracks
  const box = ap('apTracks');
  box.innerHTML = '';
  tracks.forEach(t => {
    const row = document.createElement('div');
    const on = t.accepted && t.status !== 'skipped_not_accepted';
    row.className = 'ap-row' + (on ? '' : ' off');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = on;
    cb.disabled = !editable;
    cb.setAttribute('aria-label', 'Include ' + t.title);
    cb.addEventListener('change', () => setAlbumTrack(t.index, cb.checked));
    row.appendChild(cb);
    const num = document.createElement('span');
    num.className = 'ap-num';
    const m = t.match || {};
    num.textContent = m.track_number ? `${m.disc_number > 1 ? m.disc_number + '-' : ''}${m.track_number}` : String(t.index + 1);
    row.appendChild(num);
    const body = document.createElement('div');
    body.className = 'ap-body';
    const title = document.createElement('div');
    title.className = 'ap-title';
    title.textContent = t.title;
    body.appendChild(title);
    const sub = albumTrackSub(job, t);
    // A guest artist the title doesn't already name ("Song (feat. X)").
    const extraArtist = t.artist && first.catalog && t.artist !== (first.catalog.album_artist || '') && !/\b(feat|ft|with)\b/i.test(t.title) ? t.artist : '';
    const subText = [extraArtist, sub.text].filter(Boolean).join(' · ');
    if (subText) {
      const el = document.createElement('div');
      el.className = 'ap-sub' + (sub.cls ? ' src-' + sub.cls : '');
      el.textContent = subText;
      body.appendChild(el);
    }
    row.appendChild(body);
    const dur = document.createElement('span');
    dur.className = 'ap-dur';
    row.dataset.dur = fmtDuration(t.target_duration || m.duration || t.duration);
    dur.textContent = albumCountdown && albumCountdown.index === t.index && albumCountdown.text ? albumCountdown.text : row.dataset.dur;
    row.appendChild(dur);
    const play = document.createElement('button');
    play.type = 'button';
    play.className = 'ap-play';
    play.dataset.index = t.index;
    const vid = albumTrackVid(t);
    play.disabled = !vid;
    play.setAttribute('aria-label', 'Preview ' + t.title);
    play.innerHTML = albumPlaying === t.index && !apAudio.paused ? PAUSE_ICON : PLAY_ICON;
    play.addEventListener('click', () => toggleAlbumPreview(t.index, vid, play));
    row.appendChild(play);
    box.appendChild(row);
  });

  const ticked = tracks.filter(t => t.accepted && t.status !== 'skipped_not_accepted');
  ap('apCount').textContent = `${ticked.length} of ${tracks.length} songs`;
  ap('apToggleAll').classList.toggle('hidden', !editable);
  ap('apToggleAll').textContent = ticked.length ? 'Untick all' : 'Tick all';

  renderAlbumActions(job, ticked);
}

function renderAlbumActions(job, ticked) {
  const lib = ap('apAddLib'), pl = ap('apAddPl');
  const tracks = job.tracks;
  const inPhase2 = tracks.some(t => PHASE2_STATUSES.includes(t.status) && t.status !== 'skipped_exists');
  if (job.status === 'processing' && inPhase2) {
    lib.disabled = pl.disabled = true;
    const relevant = tracks.filter(t => PHASE2_STATUSES.includes(t.status));
    const done = relevant.filter(t => ['done', 'skipped_exists', 'failed'].includes(t.status)).length;
    showAlbumProgress(done < relevant.length ? `Downloading… ${done} of ${relevant.length} done` : (job.playlist_status || 'Finishing up…'), '');
    return;
  }
  if (job.status === 'processing' || job.status === 'ready') {
    lib.disabled = pl.disabled = true;
    const looked = tracks.filter(t => t.match).length;
    showAlbumProgress(job.phase ? job.phase + '…' : (looked ? 'Finding the album audio…' : 'Looking up the songs…'), '');
    return;
  }
  if (job.status === 'error') {
    lib.disabled = pl.disabled = true;
    showAlbumProgress(job.error || 'Something went wrong.', 'bad');
    return;
  }
  if (job.status === 'cancelled') {
    lib.disabled = pl.disabled = true;
    showAlbumProgress('Cancelled.', '');
    return;
  }
  if (job.status === 'done') {
    const saved = tracks.filter(t => t.status === 'done').length;
    const had = tracks.filter(t => t.status === 'skipped_exists').length;
    const failed = tracks.filter(t => t.status === 'failed').length;
    const parts = [];
    if (saved) parts.push(`Added ${saved} song${saved === 1 ? '' : 's'}.`);
    if (had) parts.push(`${had} already in your library.`);
    if (failed) parts.push(`${failed} failed.`);
    const plMsg = job.playlist_error || job.playlist_status || '';
    showAlbumProgress(parts.join(' ') + (plMsg ? ' ' + plMsg : ''), failed || job.playlist_error ? 'bad' : 'ok');
    pl.disabled = true;
    if (failed) {
      lib.textContent = 'Retry failed';
      lib.disabled = false;
      lib.onclick = retryAlbum;
    } else {
      lib.textContent = '✓ In your library';
      lib.disabled = true;
    }
    return;
  }
  // Waiting for the user.
  const downloadable = ticked.filter(t => !t.existing && (t.source || (t.use_original && t.url)));
  const missing = ticked.filter(t => !t.source && !(t.use_original && t.url)).length;
  lib.onclick = () => addAlbum('none');
  lib.textContent = downloadable.length ? `Add ${downloadable.length} to Library` : '✓ In your library';
  lib.disabled = !downloadable.length;
  pl.disabled = !ticked.length;
  const notes = [];
  if (job.refining) notes.push('Checking the album… you can add it already.');
  if (!ticked.length) notes.push('Tick at least one song.');
  if (missing) notes.push(`${missing} song${missing === 1 ? '' : 's'} not found on YouTube.`);
  const unsure = ticked.filter(t => t.quality === 'weak' || t.quality === 'none').length;
  if (unsure) notes.push(`${unsure} unsure match${unsure === 1 ? '' : 'es'} (⚠).`);
  showAlbumProgress(notes.join(' '), missing || unsure ? 'bad' : '');
}

async function setAlbumTrack(index, accepted) {
  albumEdits++;
  try {
    const resp = await fetch(apiUrl(`/api/jobs/${albumJobId}/tracks/${index}`), {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accepted }),
    });
    if (!resp.ok) throw new Error(await errorDetail(resp));
    const t = await resp.json();
    const local = albumJob.tracks.find(x => x.index === index);
    if (local) Object.assign(local, t);
    renderAlbum(albumJob);
  } catch (e) {
    showAlbumProgress('Couldn\'t change that: ' + e.message, 'bad');
    renderAlbum(albumJob);
  } finally {
    albumEdits++;
    pollAlbum(); // re-read the server's state (also after a failure)
  }
}

ap('apToggleAll').addEventListener('click', async () => {
  if (!albumJob) return;
  const anyOn = albumJob.tracks.some(t => t.accepted && t.status !== 'skipped_not_accepted');
  const btn = ap('apToggleAll');
  btn.disabled = true;
  albumEdits++;
  try {
    const results = await Promise.all(albumJob.tracks.map(t => fetch(apiUrl(`/api/jobs/${albumJobId}/tracks/${t.index}`), {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accepted: !anyOn }),
    }).then(r => r.ok).catch(() => false)));
    if (results.every(Boolean)) {
      albumJob.tracks.forEach(t => { t.accepted = !anyOn; });
      renderAlbum(albumJob);
    } else {
      showAlbumProgress('Some songs couldn\'t be changed. Showing what the server has.', 'bad');
    }
  } finally {
    btn.disabled = false;
    albumEdits++;
    pollAlbum(); // re-read the server's state either way
  }
});

function setPlayIcons() {
  document.querySelectorAll('#apTracks .ap-play').forEach(b => {
    const mine = Number(b.dataset.index) === albumPlaying;
    b.innerHTML = mine && !apAudio.paused ? PAUSE_ICON : PLAY_ICON;
    b.classList.toggle('loading', mine && apAudio.dataset.loading === '1');
  });
}

function stopAlbumCountdown() {
  if (!albumCountdown) return;
  albumCountdown.stop();
  const row = document.querySelector(`#apTracks .ap-play[data-index="${albumCountdown.index}"]`);
  if (row) row.parentElement.querySelector('.ap-dur').textContent = row.parentElement.dataset.dur || '';
  albumCountdown = null;
}

function toggleAlbumPreview(index, vid, btn) {
  if (!vid) return;
  if (albumPlaying === index && apAudio.src) {
    if (apAudio.paused) apAudio.play().catch(() => {}); else apAudio.pause();
    return;
  }
  stopAlbumCountdown();
  if (miniInfo) miniStop();
  albumPlaying = index;
  apAudio.dataset.loading = '1';
  apAudio.src = apiUrl(`/api/preview/${vid}`);
  const cd = { index, text: '' };
  cd.stop = previewCountdown(vid, text => {
    cd.text = text;
    const b = document.querySelector(`#apTracks .ap-play[data-index="${index}"]`);
    if (b) b.parentElement.querySelector('.ap-dur').textContent = text;
  }, true);
  albumCountdown = cd;
  apAudio.play().catch(() => { apAudio.dataset.loading = ''; setPlayIcons(); });
  setPlayIcons();
}
apAudio.addEventListener('playing', () => { apAudio.dataset.loading = ''; stopAlbumCountdown(); setPlayIcons(); setNowPlaying(albumNowInfo(), apAudio); });
apAudio.addEventListener('pause', setPlayIcons);
apAudio.addEventListener('ended', setPlayIcons);
apAudio.addEventListener('error', () => {
  stopAlbumCountdown();
  if (!apAudio.src) return;
  apAudio.dataset.loading = '';
  setPlayIcons();
  showAlbumProgress('Couldn\'t play that preview.', 'bad');
});

ap('apAlbumChange').addEventListener('click', () => { albumAlbumOpen = !albumAlbumOpen; if (albumJob) renderAlbum(albumJob); });

function renderAlbumCandidates(job) {
  ap('apAlbumHint').textContent = 'Tap an album to file the songs under it.';
  renderAlbumOptions(ap('apAlbumGrid'), job, albumJobId, picked => {
    albumAlbumOpen = false;
    renderAlbum(picked);
  });
}

async function addAlbum(mode, name, playlistId) {
  ap('apAddLib').disabled = ap('apAddPl').disabled = true;
  showAlbumProgress('Starting download…', '');
  try {
    const resp = await fetch(apiUrl(`/api/jobs/${albumJobId}/confirm-match`), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'accept', playlist_mode: mode, playlist_name: name || null, playlist_id: playlistId || null }),
    });
    if (!resp.ok) throw new Error(await errorDetail(resp));
    renderAlbum(await resp.json());
    pollAlbum();
  } catch (e) {
    showAlbumProgress('Couldn\'t start the download: ' + e.message, 'bad');
    if (albumJob) renderAlbum(albumJob);
  }
}

async function retryAlbum() {
  ap('apAddLib').disabled = true;
  try {
    const resp = await fetch(apiUrl(`/api/jobs/${albumJobId}/retry-failed`), { method: 'POST' });
    if (!resp.ok) throw new Error(await errorDetail(resp));
    renderAlbum(await resp.json());
    pollAlbum();
  } catch (e) {
    showAlbumProgress('Couldn\'t retry: ' + e.message, 'bad');
    ap('apAddLib').disabled = false;
  }
}

ap('apAddPl').addEventListener('click', () => openPlaylistSheet(addAlbum));


async function openPlaylistSheet(onPick = addSong) {
  const back = document.createElement('div');
  back.className = 'sheet-back';
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  back.appendChild(sheet);
  back.addEventListener('click', e => { if (e.target === back) back.remove(); });
  document.body.appendChild(back);

  const title = document.createElement('h3');
  title.textContent = 'Add to playlist';
  sheet.appendChild(title);
  const newRow = document.createElement('div');
  newRow.className = 'row';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'New playlist name';
  const make = document.createElement('button');
  make.textContent = 'Create';
  make.addEventListener('click', () => {
    const n = input.value.trim();
    if (!n) { input.focus(); return; }
    back.remove();
    onPick('new', n);
  });
  newRow.appendChild(input);
  newRow.appendChild(make);
  sheet.appendChild(newRow);
  const list = document.createElement('div');
  list.className = 'pl-list';
  list.innerHTML = '<div class="spinner" style="margin:16px auto;"></div>';
  sheet.appendChild(list);

  let d;
  try {
    const resp = await fetch(apiUrl('/api/navidrome/playlists'));
    d = await resp.json();
  } catch (e) {
    d = { configured: true, playlists: [], error: e.message };
  }
  list.innerHTML = '';
  const note = text => { list.innerHTML = ''; const h = document.createElement('div'); h.className = 'hint'; h.style.padding = '12px'; h.style.margin = '0'; h.textContent = text; list.appendChild(h); };
  if (!d.configured) return note('Navidrome isn\'t connected, so only new playlists (saved as files) are possible.');
  if (d.error) return note('Couldn\'t load your playlists: ' + d.error);
  if (!d.playlists.length) return note('No playlists yet. Create one above.');
  d.playlists.forEach(pl => {
    const row = document.createElement('div');
    row.className = 'pl-row';
    row.innerHTML = '<span class="pl-name"></span><span class="pl-count"></span>';
    row.querySelector('.pl-name').textContent = pl.name;
    row.querySelector('.pl-count').textContent = `${pl.song_count} song${pl.song_count === 1 ? '' : 's'}`;
    row.addEventListener('click', () => { back.remove(); onPick('existing', pl.name, pl.id); });
    list.appendChild(row);
  });
}

installNowPlayingListeners();
</script>
</body>
</html>
